<script>
  window.alert = (messaggio) => {
    const errore = document.querySelector('.ingresso-errore'), campo = document.getElementById('staticrypt-password');
    errore.textContent = messaggio; errore.hidden = false;
    campo.parentElement.classList.add('sbagliata'); campo.select();
    campo.addEventListener('input', () => { errore.hidden = true; campo.parentElement.classList.remove('sbagliata'); }, { once: true });
  };
</script>

/* I valori del sistema visivo di Limpidus: colori, caratteri, misure. È l'unico posto in cui si scrivono.
   Li usano il sito (src/styles/base.css) e i documenti ufficiali, che importano questo stesso file.
   Come si usano è spiegato nella pagina /sistema. */
:root {
  /* ---- colori ---- */
  --carta: #FCFDFD;        /* il fondo: bianco appena freddo */
  --inchiostro: #0F2B36;   /* il testo */
  --grafite: #1C2126;      /* il logo, le schede, i fondi scuri */
  --ardesia: #4A555C;      /* note e testo secondario */
  --acqua: #4F9DAB;        /* il filo: sottolineature e linee, mai testo piccolo */
  --acqua-fonda: #357F8D;  /* la stessa acqua, scurita quanto basta per il testo piccolo */
  --ghiaccio: #D3E4EA;     /* filetti e bordi */
  --velo: #EEF4F6;         /* fondo delle righe in evidenza */
  --fondo: #F4F6F7;        /* fondo delle schede */

  /* ---- l'aria: il fondo della home, una stanza illuminata dall'alto. Stessa famiglia di azzurro del ghiaccio ---- */
  --aria-chiara: #EFF5F6;  /* vicino alla luce */
  --aria: #E5EEF1;         /* il fondo */
  --aria-fonda: #D8E4E9;   /* lontano dalla luce, ai bordi */
  --bruma: #C3D6DD;        /* filetti sull'aria, dove il ghiaccio non si vede */

  /* ---- il logo ---- */
  --logo-tratto: var(--grafite);  /* spigoli, contorno e scritta */
  --logo-base: #FCFDFD;           /* la faccetta più chiara */
  --logo-pigmento: #B9D3DD;       /* il colore che le faccette prendono, ognuna per la sua tinta */
  --logo-forma: #7FAEBB;          /* la sola forma, sotto i 40 px */

  /* ---- caratteri: tre voci, ognuna col suo compito ---- */
  --insegna: 'Josefin Sans Variable', 'Hanken Grotesk Variable', 'Helvetica Neue', Arial, sans-serif;  /* solo il nome nel logo */
  --prosa: 'Spectral', Georgia, 'Times New Roman', serif;                                               /* racconta: testi e titoli */
  --strumento: 'Hanken Grotesk Variable', 'Helvetica Neue', Arial, sans-serif;                          /* misura: schede, cifre, note, segni */
  --insegna-peso: 385;     /* a questo peso l'asta di una lettera è spessa quanto una linea del marchio */
  --insegna-peso-piccolo: 500;

  /* ---- la pagina di lettura: una colonna di prosa, un canale, una colonna di note ---- */
  --col-prosa: 39rem;
  --canale: 3.5rem;
  --col-note: 17rem;
  --blocco: calc(var(--col-prosa) + var(--canale) + var(--col-note));
  --riga-prosa: 1.62;
  /* distanza fra la cima di una riga di prosa e la sottolineatura della cifra: lì parte il filo verso la nota */
  --quota-filo: 1.5rem;
}

/* Su fondo scuro il logo si rovescia: basta data-fondo="scuro" su un elemento che lo contiene. */
[data-fondo='scuro'] {
  --logo-tratto: #FCFDFD;
  --logo-base: #1C2126;
  --logo-pigmento: #8FB4C0;
  --logo-forma: #FCFDFD;
}

/* La scena di Limpidus: l'aria, la luce che scende dal nome, il passaggio fra le pagine. La usano la home, la proposta e la pagina
   della password (che la riceve da strumenti/prepara.mjs). I colori vengono da gettoni.css. */

/* ---- l'aria: il fondo di una stanza illuminata dall'alto, più chiara attorno al nome, più fonda lontano ---- */
.aria { background: radial-gradient(120% 100% at 50% 0%, var(--aria-chiara) 0%, var(--aria) 40%, var(--aria-fonda) 100%); }

/* ---- il nome, come nel logo: Josefin Sans maiuscolo, lettere distribuite su una larghezza fissa.
   Si scrive una lettera per <span>. --nome-corpo è la grandezza del carattere: serve anche al fascio di luce. ---- */
.nome { --nome-corpo: clamp(2rem, .8rem + 3vw, 4rem); display: flex; justify-content: space-between; width: clamp(15rem, 6rem + 22vw, 30rem);
        margin: 0 auto; font-family: var(--insegna); font-weight: var(--insegna-peso); font-size: var(--nome-corpo); line-height: 1;
        text-transform: uppercase; text-box: trim-both cap alphabetic; color: var(--grafite); }

/* ---- la luce: un faretto. Un fascio bianco che si apre da un punto sopra il nome (--cima), pieno al centro e sfumato
   ai bordi (il gradiente è per angolo, attorno a quel punto). Comincia piano sotto la linea di base del nome, si
   attenua con la distanza e finisce in una pozza di luce sul piano. Chi lo contiene dice:
     --nome-base  a che altezza sta la linea di base del nome, dalla cima del contenitore
     --piano      a che altezza sta il piano, dal fondo del contenitore ---- */
.cono, .pozza { position: absolute; left: 50%; translate: -50% 0; pointer-events: none; }
.cono { --cima: 19rem; width: min(72rem, 100vw); top: calc(var(--nome-base) - var(--cima)); bottom: calc(var(--piano) - 1.6rem);
        background: conic-gradient(from 180deg at 50% 0, #fff 0deg, rgb(255 255 255 / .94) 11deg, rgb(255 255 255 / .7) 15deg,
                                   rgb(255 255 255 / .34) 18.5deg, rgb(255 255 255 / .1) 21.5deg, transparent 25deg, transparent 335deg, rgb(255 255 255 / .1) 338.5deg,
                                   rgb(255 255 255 / .34) 341.5deg, rgb(255 255 255 / .7) 345deg, rgb(255 255 255 / .94) 349deg, #fff 360deg);
        -webkit-mask-image: linear-gradient(to bottom, transparent calc(var(--cima) - 1rem), rgb(0 0 0 / .55) calc(var(--cima) + 2.5rem), #000 calc(var(--cima) + 8rem), rgb(0 0 0 / .8) 74%, transparent 100%);
        mask-image: linear-gradient(to bottom, transparent calc(var(--cima) - 1rem), rgb(0 0 0 / .55) calc(var(--cima) + 2.5rem), #000 calc(var(--cima) + 8rem), rgb(0 0 0 / .8) 74%, transparent 100%); }
.pozza { width: min(46rem, 98vw); bottom: calc(var(--piano) - 2rem); height: 4rem;
         background: radial-gradient(closest-side, rgb(255 255 255 / .95), rgb(255 255 255 / .55) 55%, transparent); }

/* L'ombra della pietra cade sul piano sotto la punta, staccata da lei, al centro della pozza: un nucleo più scuro e un
   alone largo e tenue. Sta dentro l'elemento che contiene la pietra, prima di lei. */
.ombra { position: absolute; left: 19%; right: 19%; top: calc(100% + .7rem); height: 1.5rem; pointer-events: none;
         background: radial-gradient(closest-side, color-mix(in oklab, var(--inchiostro) 26%, transparent), color-mix(in oklab, var(--inchiostro) 9%, transparent) 45%, transparent 100%); }

/* ---- il foglio: carta sull'aria. Bianco, col bordo bianco che fa da spigolo in luce, staccato dal fondo da un filo
   di bruma e da un'ombra d'inchiostro ---- */
.foglio { background: var(--carta); border: 1px solid var(--carta);
          box-shadow: 0 0 0 1px color-mix(in oklab, var(--bruma) 55%, transparent), 0 2rem 3.4rem -2.2rem color-mix(in oklab, var(--inchiostro) 45%, transparent); }

/* ---- il pulsante: d'inchiostro, a pillola ---- */
.pulsante { display: inline-block; font-family: var(--strumento); font-size: .9rem; font-weight: 500; color: var(--carta); background: var(--inchiostro);
            text-decoration: none; padding: .74rem 1.7rem; border: 0; border-radius: 99px; cursor: pointer; transition: background .2s; }
.pulsante:hover { background: color-mix(in oklab, var(--inchiostro) 78%, var(--acqua)); }

/* ---- il passaggio fra le pagine: un velo bianco sopra tutto. Entrando, la pagina esce dal bianco (.entra); uscendo
   ci sfuma dentro (.esce, la mette public/passaggio.js). Un quarto di secondo ciascuno. La home non ha .entra: ha la
   sua apertura lenta ---- */
.velo-pagina { position: fixed; inset: 0; z-index: 100; background: var(--carta); pointer-events: none; opacity: 0; transition: opacity .25s ease-in; }
.velo-pagina.esce { opacity: 1; }
@keyframes dal-bianco { from { opacity: 1; } }
@media (prefers-reduced-motion: no-preference) { .velo-pagina.entra { animation: dal-bianco .25s ease-out both; } }
@media print { .velo-pagina { display: none; } }

/* La pagina della password di /proposta: la scena della home (aria, luce dal nome, pietra) e, sotto, un foglio con il
   campo della password. Si aggiunge al modello di StatiCrypt in strumenti/prepara.mjs, dopo gettoni.css e scena.css:
   i selettori ricalcano quelli del modello per avere la precedenza. */
html { font-size: clamp(16px, 10px + .5vw, 24px); }
.staticrypt-content { height: auto; min-height: 100%; margin: 0; font-family: var(--strumento); color: var(--inchiostro); }
.staticrypt-page { width: auto; max-width: 25rem; margin: 0 auto; padding: 3.4rem 1.2rem 3rem; display: grid; justify-items: center; }

/* ---- la scena: il nome, la luce, la pietra ---- */
.ingresso-scena { --corpo: 2rem; --nome-base: calc(var(--corpo) * .74); --piano: 1.5rem; position: relative; display: grid; justify-items: center; padding-bottom: 3rem; }
.ingresso-scena .nome { --nome-corpo: var(--corpo); position: relative; width: 16rem; }
.ingresso-scena .cono { --cima: 9rem; width: min(30rem, 100vw); }
.ingresso-scena .pozza { width: min(20rem, 96vw); height: 2.6rem; bottom: calc(var(--piano) - 1.3rem); }
.ingresso-pietra { position: relative; width: 9.5rem; margin-top: 2.2rem; }
.ingresso-pietra svg { position: relative; display: block; width: 100%; height: auto; }

/* ---- il foglio con la password ---- */
.staticrypt-form.foglio { position: relative; box-sizing: border-box; width: 100%; max-width: none; margin: 0; padding: 1.8rem 1.9rem 1.6rem; border-radius: 1.2rem; text-align: left; }
.staticrypt-instructions { margin: 0; }
.staticrypt-instructions p { font-size: .88rem; line-height: 1.5; color: var(--ardesia); margin: 0; }
.staticrypt-instructions .staticrypt-title { font-family: var(--prosa); font-weight: 300; font-size: 1.6rem; line-height: 1.2; color: var(--inchiostro); margin: 0 0 .45rem; }
.staticrypt-hr { margin: 1.2rem 0; border-top: 1px solid var(--ghiaccio); }
.staticrypt-password-container { background: var(--velo); border: 1px solid transparent; border-radius: .7rem; margin: 0 0 .9rem; transition: border-color .2s; }
.staticrypt-password-container:focus-within { border-color: var(--acqua); }
.staticrypt-password-container.sbagliata { border-color: var(--inchiostro); }
.staticrypt-form input[type="password"], .staticrypt-form input[type="text"] { font-family: var(--strumento); font-size: 1rem; color: var(--inchiostro); padding: .85rem 2.8rem .85rem 1rem;
                                                                                    background: transparent; border-radius: .7rem; }
/* i pallini della password li disegna il carattere: in Hanken Grotesk sono quadrati, in quello di sistema sono tondi.
   Il testo d'invito resta in Hanken Grotesk, e così la password quando la si mostra (il campo diventa di testo). */
.staticrypt-form input[type="password"] { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: .14em; }
.staticrypt-form input[type="password"]::placeholder { font-family: var(--strumento); letter-spacing: 0; }
.staticrypt-form label.staticrypt-remember { font-size: .84rem; color: var(--ardesia); margin-bottom: 1.1rem; cursor: pointer; }
.staticrypt-form .staticrypt-remember input[type="checkbox"] { transform: none; width: 1rem; height: 1rem; margin: 0 .6rem 0 0; accent-color: var(--inchiostro); }
.staticrypt-form .staticrypt-decrypt-button { font-family: var(--strumento); font-size: .95rem; font-weight: 500; text-transform: none; color: var(--carta); background: var(--inchiostro);
                                               padding: .85rem; border-radius: 99px; transition: background .2s; }
.staticrypt-form .staticrypt-decrypt-button:hover, .staticrypt-form .staticrypt-decrypt-button:focus { background: color-mix(in oklab, var(--inchiostro) 78%, var(--acqua)); filter: none; }
.ingresso-errore { font-size: .86rem; font-weight: 500; color: var(--inchiostro); margin: 1rem 0 0; }
.ingresso-errore[hidden] { display: none; }
.ingresso-casa { font-size: .82rem; color: var(--ardesia); margin-top: 1.5rem; text-decoration-color: var(--acqua); text-underline-offset: .22em; }
:focus-visible { outline: 2px solid var(--acqua-fonda); outline-offset: 3px; }

</style>
